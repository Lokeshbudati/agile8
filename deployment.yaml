apiVersion: apps/v1
kind: Deployment
metadata:
  name: prof1
spec:
  replicas: 2

  selector:
    matchLabels:
      app: prof1

  template:
    metadata:
      labels:
        app: prof1

    spec:
      containers:
        - name: prof1
          image: lokeshbudati/prof1:latest
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: prof1-service

spec:
  type: NodePort

  selector:
    app: prof1

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
